# Shared full-body workouts. Exercise names must already exist from
# devshell/seed_gym_exercises.py. This file does not create exercises.
workouts:
  - name: Beginner Full Body
    description: >
      Equipment: a pair of dumbbells, a bench, and a cable station. Squat, glute bridge, calf raise, and plank can be bodyweight. Leave a few reps in reserve so the next set stays clean.
      If the cable station is unavailable, use Bent-Over Row instead of Rows.
      If dumbbells are unavailable, use Push-Up instead of Dumbbell Bench Press.
      If a bench is unavailable, use Push-Up instead of Dumbbell Bench Press.
    minutes: 40
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and shoulders, then do two easy sets of the first squat. Stop if a joint hurts.
      - exercise: Squat
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Dumbbell Bench Press
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Rows
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Glute Bridge
        sets: 3
        reps: 10-15
        rest: 60
      - exercise: Calf Raise
        sets: 2
        reps: 12-15
        rest: 45
      - exercise: Plank
        sets: 2
        prescribed_duration_seconds: 20
        rest: 45
      - type: cooldown
        title: Cool down
        instructions: Shake out the arms and legs. Stretch the hips, chest, and back gently.

  - name: Intermediate Full Body
    description: >
      Equipment: a barbell, a bench, a pair of dumbbells, and a cable station. Use a weight you can finish with one or two reps left.
      If the barbell is unavailable, use Dumbbell Bench Press instead of Bench Press. Squat, Bent-Over Row, and Romanian Deadlift can use dumbbells.
      If the bench is unavailable, use Push-Up instead of Bench Press.
      If the cable station is unavailable, use Pull-Up instead of Lat Pulldown.
      If neither a barbell nor dumbbells is available, use Glute Bridge instead of Romanian Deadlift.
    minutes: 55
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and shoulders and do two easy sets of the first squat. Stop if a joint hurts.
      - exercise: Squat
        sets: 4
        reps: 6-8
        rest: 120
      - exercise: Bench Press
        sets: 3
        reps: 6-8
        rest: 120
      - exercise: Bent-Over Row
        sets: 3
        reps: 8-10
        rest: 90
      - exercise: Romanian Deadlift
        sets: 3
        reps: 8-10
        rest: 90
      - exercise: Lat Pulldown
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Calf Raise
        sets: 3
        reps: 12-15
        rest: 60
      - exercise: Plank
        sets: 3
        prescribed_duration_seconds: 30
        rest: 45
      - type: cooldown
        title: Cool down
        instructions: Shake out the arms and legs. Stretch the hips, chest, and back gently.

  - name: Advanced Full Body
    description: >
      Equipment: a barbell, a bench, a pull-up bar, and a pair of dumbbells. Bulgarian split squat and calf raise can be bodyweight.
      Keep the listed rest, and leave one rep in reserve on the compounds.
      If the barbell is unavailable, use Romanian Deadlift instead of Deadlift, Dumbbell Bench Press instead of Bench Press, Seated Dumbbell Press instead of Overhead Press, and Glute Bridge instead of Hip Thrust.
      If the pull-up bar is unavailable, use Lat Pulldown instead of Pull-Up and Reverse Crunch instead of Hanging Leg Raise.
      If the bench is unavailable, use Push-Up instead of Bench Press and Glute Bridge instead of Hip Thrust.
    minutes: 70
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and shoulders, then build to the working weight with two lighter sets of the first pull. Stop if a joint hurts.
      - exercise: Deadlift
        sets: 5
        reps: 3-5
        rest: 180
      - exercise: Bench Press
        sets: 4
        reps: 4-6
        rest: 150
      - exercise: Pull-Up
        sets: 4
        reps: 5-8
        rest: 120
      - exercise: Bulgarian Split Squat
        sets: 3
        reps: 6-8
        rest: 90
      - exercise: Overhead Press
        sets: 3
        reps: 6-8
        rest: 90
      - exercise: Hip Thrust
        sets: 3
        reps: 8-10
        rest: 75
      - exercise: Hanging Leg Raise
        sets: 3
        reps: 8-12
        rest: 60
      - exercise: Calf Raise
        sets: 3
        reps: 12-15
        rest: 45
      - type: cooldown
        title: Cool down
        instructions: Shake out the arms and legs. Stretch the hips, chest, hamstrings, and lats gently.
