# Shared lower-body workouts. Exercise names must already exist from
# devshell/seed_gym_exercises.py. This file does not create exercises.
workouts:
  - name: Beginner Lower Body
    description: >
      Equipment: a pair of dumbbells and a bench. The squat, lunge, and calf raise can be bodyweight. Leave a few reps in reserve so the next set stays clean.
      If dumbbells are unavailable, use Glute Bridge instead of Romanian Deadlift.
      If a bench is unavailable, use Lunge instead of Bulgarian Split Squat.
    minutes: 40
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and ankles, then do two easy sets of the first squat. Stop if a joint hurts.
      - exercise: Squat
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Romanian Deadlift
        sets: 3
        reps: 10-12
        rest: 90
      - exercise: Lunge
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Bulgarian Split Squat
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Calf Raise
        sets: 2
        reps: 12-15
        rest: 60
      - type: cooldown
        title: Cool down
        instructions: Shake out the legs. Stretch the hips, hamstrings, and calves gently.

  - name: Intermediate Lower Body
    description: >
      Equipment: a barbell, a bench, and a pair of dumbbells. Use a weight you can finish with one or two reps left.
      If the barbell is unavailable, use Glute Bridge instead of Hip Thrust. Squat and Romanian Deadlift can use dumbbells.
      If the bench is unavailable, use Glute Bridge instead of Hip Thrust and Lunge instead of Bulgarian Split Squat.
    minutes: 55
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and ankles and do two easy sets of the first squat. Stop if a joint hurts.
      - exercise: Squat
        sets: 4
        reps: 6-8
        rest: 120
      - exercise: Romanian Deadlift
        sets: 4
        reps: 6-8
        rest: 120
      - exercise: Hip Thrust
        sets: 3
        reps: 8-10
        rest: 90
      - exercise: Bulgarian Split Squat
        sets: 3
        reps: 8-12
        rest: 90
      - exercise: Lunge
        sets: 3
        reps: 10-12
        rest: 60
      - exercise: Calf Raise
        sets: 3
        reps: 12-15
        rest: 60
      - type: cooldown
        title: Cool down
        instructions: Shake out the legs. Stretch the hips, hamstrings, and calves gently.

  - name: Advanced Lower Body
    description: >
      Equipment: a barbell, a bench, and a pair of dumbbells. Keep the listed rest, and leave one rep in reserve on the compounds.
      If the barbell is unavailable, use Glute Bridge instead of Hip Thrust. Squat and Romanian Deadlift can use dumbbells.
      If the bench is unavailable, use Glute Bridge instead of Hip Thrust and Lunge instead of Bulgarian Split Squat.
    minutes: 70
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the hips and ankles, then build to the working weight with two lighter sets of the first squat. Stop if a joint hurts.
      - exercise: Squat
        sets: 5
        reps: 4-6
        rest: 150
      - exercise: Romanian Deadlift
        sets: 4
        reps: 6-8
        rest: 120
      - exercise: Hip Thrust
        sets: 4
        reps: 6-8
        rest: 120
      - exercise: Bulgarian Split Squat
        sets: 4
        reps: 6-8
        rest: 90
      - exercise: Lunge
        sets: 3
        reps: 8-10
        rest: 75
      - exercise: Calf Raise
        sets: 3
        reps: 12-15
        rest: 45
      - type: cooldown
        title: Cool down
        instructions: Shake out the legs. Stretch the hips, hamstrings, and calves gently.
