# Shared 16-week general fitness program. Exercise names must already exist from
# devshell/seed_gym_exercises.py. This file does not create exercises.
# Workout names describe the session. The same workout can appear in more than one week.
workouts:
  - name: Foundation Upper Press
    description: >
      Equipment: a barbell, a bench, a pair of dumbbells, and a cable station.
      Leave a few reps in reserve so the next set stays clean.
      If the barbell is unavailable, use Dumbbell Bench Press instead of Bench Press.
      If the bench is unavailable, use Push-Up instead of Bench Press.
      If dumbbells are unavailable, use Overhead Press instead of Seated Dumbbell Press, use Barbell Curl instead of Dumbbell Curl, and skip Standing Lateral Raise.
      If the cable station is unavailable, use Diamond Push-Up instead of Cable Pushdown.
    minutes: 50
    blocks:
      - type: warmup
        title: Warm up
        instructions: Move the shoulders, then do two easy sets of the first press. Stop if a joint hurts.
      - exercise: Bench Press
        sets: 3
        reps: 12-15
        rest: 75
      - exercise: Bent-Over Row
        sets: 3
        reps: 12-15
        rest: 75
      - exercise: Seated Dumbbell Press
        sets: 3
        reps: 12-15
        rest: 75
      - exercise: Standing Lateral Raise
        sets: 3
        reps: 12-15
        rest: 60
      - exercise: Dumbbell Curl
        sets: 3
        reps: 12-15
        rest: 60
      - exercise: Cable Pushdown
        sets: 3
        reps: 12-15
        rest: 60
      - type: cooldown
        title: Cool down
        instructions: Shake out the arms. Stretch the chest and the lats gently.

  - name: Foundation Upper Pull
