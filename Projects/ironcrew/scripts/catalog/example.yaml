# Shared catalog. Both owner columns stay null, so every signed-in user can use these rows.
# A later file can refer to these with exercise_id or workout_id instead of repeating them.
exercises:
  - name: Bench Press
    muscle: chest
    equipment: barbell
workouts:
  - name: Push A
    minutes: 60
    blocks:
      - exercise: Bench Press
        sets: 4
        reps: 6-8
        rest: 120
programs:
  - name: Push Pull
    phases:
      - name: Base
        weeks:
          - days:
              - day: 1
                workout: Push A
