[project]
name = "ironcrew-devshell"
version = "0.1.0"
description = "IPython shell for inspecting and managing Ironcrew database models"
requires-python = ">=3.11"
dependencies = [
  "ipython>=8",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ironcrew-shell = "devshell.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devshell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
